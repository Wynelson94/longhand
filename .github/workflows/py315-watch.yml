name: Python 3.15 watch

# Longhand cannot install on Python 3.15 yet. onnxruntime (required by
# chromadb, and what Longhand's embeddings run on) publishes no cp315 wheel,
# and it has never published a source distribution, so pip has nothing to
# install and nothing to build. Checked 2026-11-20: newest onnxruntime was
# 1.32.0, wheels for cp311-cp314 only.
#
# Nothing in Longhand caps the Python version, so the install can start
# working without a Longhand release once upstream ships that wheel. This job
# retries every week and opens ONE issue when the install first succeeds.
#
# Evidence-gathering only, same idea as the Windows leg in ci.yml: it never
# gates a PR, and a failed install step here is the EXPECTED state for now,
# not something to fix in this repo. The job itself stays green either way;
# read the job summary for the real result.
#
# Retire this file when 3.15 joins the gated matrix in ci.yml.

on:
  schedule:
    - cron: "23 14 * * 1" # Mondays, 14:23 UTC
  workflow_dispatch:
  pull_request:
    # Only when this file itself changes, so an edit to the watch is exercised
    # before it merges. Ordinary PRs never run it.
    paths:
      - ".github/workflows/py315-watch.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Install + tests on Python 3.15 (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      # No `cache: pip` on purpose. chroma-hnswlib builds from source on every
      # Python above 3.12, and a cached native build is the trap documented in
      # ci.yml ("Evict natively-compiled hnswlib wheels from the pip cache").
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install dependencies
        id: install
        continue-on-error: true
        # Explicit bash turns on pipefail, so pip's exit status survives `tee`.
        shell: bash
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>&1 | tee install.log
      - name: Run pytest
        id: pytest
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pytest -q
      - name: Summarize
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
        run: |
          {
            echo "### Python 3.15 watch"
            echo
            echo "- install: \`$INSTALL\`"
            echo "- pytest: \`$PYTEST\`"
            echo
            if [ "$INSTALL" != "success" ]; then
              echo "Not yet: Longhand does not install on Python 3.15. Last pip errors:"
              echo
              echo '```'
              if [ -f install.log ] && grep -qE '^ERROR' install.log; then
                grep -E '^ERROR' install.log | tail -n 5
              elif [ -f install.log ]; then
                tail -n 15 install.log
              else
                echo "(no install.log: the step failed before pip ran)"
              fi
              echo '```'
              echo
              echo "Expected while onnxruntime has no cp315 wheel. An error that does not name onnxruntime is a second problem worth a look."
            elif [ "$PYTEST" = "success" ]; then
              echo "Python 3.15 installs and the suite passes. Promote it to the gated matrix in ci.yml."
            else
              echo "Python 3.15 installs, but the suite does not pass. Fix that before promoting it to the gated matrix."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open the promote-to-CI issue (once)
        # Never from a pull_request run: a PR only proves the workflow file
        # works, and a fork's token could not open the issue anyway.
        if: steps.install.outcome == 'success' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTEST: ${{ steps.pytest.outcome }}
        run: |
          title="Python 3.15 now installs: promote it to the CI matrix"
          # Exact-title match over open AND closed issues, so a closed one is
          # never reopened as a duplicate.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json title --jq "map(select(.title == \"$title\")) | length")
          if [ "$existing" != "0" ]; then
            echo "Issue already exists; nothing to do."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The weekly watch job installed Longhand on Python 3.15 for the first time."
            echo
            echo "- Run: $run_url"
            echo "- pytest on 3.15: \`$PYTEST\`"
            echo
            echo "If pytest passed:"
            echo
            echo "- [ ] Add \`\"3.15\"\` to the matrix in \`.github/workflows/ci.yml\`"
            echo "- [ ] Add the \`Programming Language :: Python :: 3.15\` classifier in \`pyproject.toml\`"
            echo "- [ ] Update the README's Platform support section (range, and drop the 3.15 note)"
            echo "- [ ] Delete \`.github/workflows/py315-watch.yml\`"
            echo "- [ ] Add \"Tests (Python 3.15)\" to the required checks on \`main\`"
            echo
            echo "If pytest failed, fix those failures first; the run above has the output."
          } > issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
