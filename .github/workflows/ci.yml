name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (with coverage gate)
        # 3.14 runs but is non-blocking: onnxruntime's cp314 wheel (via chromadb)
        # intermittently raises an illegal-instruction SIGILL on GitHub's
        # heterogeneous runner CPUs. The CPython code is fine (3.14 passes locally
        # and on most runners); only the native embedding lib is unstable. Keep
        # 3.10–3.13 gated; surface 3.14 without letting a native crash block PRs.
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: pytest -q --cov=longhand --cov-report=term-missing --cov-fail-under=60

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.5.0"
      - name: Run ruff
        run: ruff check longhand tests

  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version sync
        run: python scripts/check_version_sync.py

  typecheck:
    name: mypy (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy
        # Type debt (see AUDIT) is paid down incrementally — surfaced here, not
        # gated, so the job stays green. Remove continue-on-error once clean.
        continue-on-error: true
        run: mypy longhand
