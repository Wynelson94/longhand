name: Publish to PyPI and the MCP Registry

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # NOTE: enable "Required reviewers" on the 'pypi' environment in the repo
    # Settings → Environments so a human must approve each publish. Without that
    # protection rule, any pushed v* tag publishes to PyPI unattended.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    name: Publish to the MCP Registry
    # After PyPI, never before: the registry checks that the PyPI release exists
    # and that its README carries the mcp-name marker. No approval of its own;
    # the PyPI job above already waited for one. If this job fails, the PyPI
    # release stands: re-run the job, or publish by hand
    # (docs/distribution-submissions.md).
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # GitHub OIDC sign-in to the registry; no stored secret
    env:
      # Pinned on purpose. To upgrade, set another release tag of
      # modelcontextprotocol/registry, never the mutable releases/latest URL.
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check server.json against the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="$(jq -r .name server.json)"
          for field in .version '.packages[0].version'; do
            value="$(jq -r "$field" server.json)"
            if [ "$value" != "$version" ]; then
              echo "::error::server.json $field is $value, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          if ! grep -qF "mcp-name: $name" README.md; then
            echo "::error::README.md lacks 'mcp-name: $name', which the registry looks for on PyPI"
            exit 1
          fi
          {
            echo "SERVER_NAME=$name"
            echo "SERVER_NAME_URI=$(jq -rn --arg name "$name" '$name | @uri')"
            echo "SERVER_VERSION=$version"
            echo "PYPI_PACKAGE=$(jq -r '.packages[0].identifier' server.json)"
          } >> "$GITHUB_ENV"

      - name: Wait until PyPI serves the release
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/${PYPI_PACKAGE}/${SERVER_VERSION}/json"
          for _ in $(seq 1 40); do
            if curl --fail --silent --output /dev/null "$url"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::PyPI did not serve ${PYPI_PACKAGE} ${SERVER_VERSION} within 10 minutes"
          exit 1

      - name: Check whether the registry already has this version
        id: registry
        run: |
          set -euo pipefail
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER_NAME_URI}/versions/${SERVER_VERSION}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url")"
          if [ "$status" = "200" ]; then
            echo "::notice::${SERVER_NAME} ${SERVER_VERSION} is already on the registry; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher publish
